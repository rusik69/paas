# Thin, not thick: replicated-3 needs three copies of every volume, and a 20 GB
# scratch disk cannot hold three thickly-provisioned 5 GB PVCs plus overhead.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: paas-storage-pool
spec:
  nodeSelector:
    matchLabels:
      paas.io/storage-node: "true"
  storagePools:
    - name: pool
      lvmThinPool:
        volumeGroup: vg-paas
        thinPool: thin
      source:
        hostDevices:
          - /dev/vdb
