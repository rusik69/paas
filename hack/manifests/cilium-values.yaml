# Cilium values for Talos. See ADR 0002 — Cilium is the only dataplane.
#
# Every block is here because Talos differs from a generic distro in a way that
# breaks the Cilium defaults. Removing one produces a cluster where pods start
# but networking silently does not work.

ipam:
  mode: kubernetes

# Talos runs no kube-proxy, and the in-cluster Service IP does not resolve until
# Cilium is up, so it must be told where the API server is.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445 # Talos KubePrism

# A no-op today: Cilium 1.18's NewKPRConfig forces this on whenever
# kubeProxyReplacement is true. Set explicitly because socket LB in the host
# namespace is exactly what lets containerd reach the in-cluster registry's
# ClusterIP (hack/manifests/registry.yaml), and the rendered cilium-config
# ConfigMap otherwise reads bpf-lb-sock: "false", which claims the opposite.
socketLB:
  enabled: true

# Talos mounts cgroup2 itself and its root filesystem is read-only, so Cilium's
# automount init container cannot do its usual work.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos grants no ambient capabilities. These are the minimum each needs.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# The ingress path for the app plane (phase 4). Enabling it now costs nothing
# and means the routing layer is never retrofitted. Requires the Gateway API
# CRDs, installed by e2e.sh before this chart.
gatewayAPI:
  enabled: true

# Hubble flow metrics become per-tenant egress bytes for billing in phase 6.
# Namespace-scoped deliberately: per-pod flow labels multiply series count by
# pod churn and will melt Prometheus at 200 tenants.
hubble:
  enabled: true
  relay:
    enabled: true
  metrics:
    enabled:
      - "flow:sourceContext=namespace;destinationContext=namespace"
      - "drop:sourceContext=namespace;destinationContext=namespace"

# Default is 2, and this cluster has one control plane that runs no workloads.
operator:
  replicas: 1
