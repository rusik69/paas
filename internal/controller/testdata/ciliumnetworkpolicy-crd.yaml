# A minimal CiliumNetworkPolicy definition, for envtest only.
#
# envtest runs an apiserver with no Cilium, so the kind must exist for the
# reconciler's applies to be storable and readable. The schema is deliberately
# open: what this fixture buys is "the operator wrote the object we expected",
# and whether Cilium *enforces* it is a question only a real cluster with a real
# dataplane can answer — which is what test/e2e is for.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
spec:
  group: cilium.io
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
    shortNames: [cnp]
  scope: Namespaced
  versions:
    - name: v2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
