---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: packages.platform.paas.io
spec:
  group: platform.paas.io
  names:
    kind: Package
    listKind: PackageList
    plural: packages
    singular: package
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.chart
      name: Chart
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.stage
      name: Stage
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Package is one component of a platform release.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PackageSpec is one component at one version.
            properties:
              chart:
                description: Chart is the chart name within the source.
                minLength: 1
                type: string
              sourceRef:
                description: SourceRef names the PackageSource this chart is pulled
                  from.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              stage:
                description: Stage orders this package within a rollout.
                enum:
                - migration
                - component
                type: string
              values:
                description: |-
                  Values are passed to the chart, constrained by the chart's own
                  values.schema.json rather than by anything here.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              version:
                description: Version is the chart version.
                minLength: 1
                type: string
            required:
            - chart
            - sourceRef
            - stage
            - version
            type: object
          status:
            description: PackageStatus reports what was applied.
            properties:
              appliedDigest:
                description: AppliedDigest is the artifact digest last applied.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
