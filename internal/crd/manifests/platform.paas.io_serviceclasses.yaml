              observedChartVersion:
                description: |-
                  ObservedChartVersion is the chart version the live CRD schema was
                  generated from, so "which schema is serving" is answerable without
                  pulling anything.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
