              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceClassSpec declares one tenant-facing kind and the
              chart behind it.
            properties:
              chart:
                description: Chart supplies the values.schema.json that becomes this
