---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: tenants.core.paas.io
spec:
  group: core.paas.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    shortNames:
    - tn
    singular: tenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.plan
      name: Plan
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tenant is a namespace, a quota, and a position in the tenant tree.

          Namespaced deliberately: a Tenant lives in its parent's namespace, and that
          is how the tree is expressed. Root tenants live in tenant-root.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantSpec is the tenant's declared shape.
            properties:
              admins:
                description: |-
                  Admins are the identities granted tenant-admin over this tenant and its
                  descendants.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              host:
                description: |-
                  Host is the wildcard domain this tenant's apps are published under.
                  Unused until the app plane exists.
                type: string
              isolation:
                default: shared
                description: |-
                  Isolation is immutable: changing it would move every workload between
                  node pools, which is a migration rather than an update.
                enum:
                - shared
                - dedicated-nodes
                type: string
                x-kubernetes-validations:
                - message: isolation is immutable; moving a tenant between node pools
                    is a migration
                  rule: self == oldSelf
              modules:
                additionalProperties:
                  description: |-
                    Module is tenant-level infrastructure enabled at a node and inherited by its
                    descendants.
                  properties:
                    enabled:
                      description: |-
                        Enabled turns the module on for this tenant and its descendants.

                        False is not a denial: resolution walks up to the nearest ancestor that
                        has it enabled, so false on a child means "use my parent's".
                      type: boolean
                  required:
                  - enabled
                  type: object
                description: |-
                  Modules enables tenant-level infrastructure, keyed by module name.

                  A map rather than a list, so a child overriding one module under
                  server-side apply cannot replace the whole set.
                type: object
              plan:
                description: Plan drives the quota and limits applied to this tenant's
                  namespace.
                enum:
                - trial
                - business
                - enterprise
                type: string
            required:
            - plan
            type: object
          status:
            description: TenantStatus reports what the tenant resolved to.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              modules:
                additionalProperties:
                  description: ModuleStatus is where one module resolved to.
                  properties:
                    inherited:
                      description: Inherited is false when this tenant provides the
                        module itself.
                      type: boolean
                    namespace:
                      description: Namespace is where that tenant's module runs.
                      type: string
                    tenant:
                      description: |-
                        Tenant is the name of the tenant providing the module — this one, or the
                        nearest ancestor with it enabled.
                      type: string
                  required:
                  - namespace
                  - tenant
                  type: object
                description: |-
                  Modules reports where each enabled module resolved to, keyed by module
                  name. A child inheriting its parent's monitoring shows the parent here.

                  Reported because resolution walks the ancestor chain and is otherwise
                  invisible: "which monitoring stack serves this tenant" is the question
                  ADR 0004 warns will be answered inconsistently, and this is the answer
                  the platform actually used.
                type: object
              namespace:
                description: |-
                  Namespace is the path-derived namespace backing this tenant. Reported
                  because it is derived rather than declared, and everything a tenant owns
                  lives in it.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
