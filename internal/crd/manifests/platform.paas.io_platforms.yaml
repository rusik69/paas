---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: platforms.platform.paas.io
spec:
  group: platform.paas.io
  names:
    kind: Platform
    listKind: PlatformList
    plural: platforms
    singular: platform
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.current.version
      name: Current
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Platform pins one platform release for the whole cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlatformSpec pins the platform release the cluster converges
              on.
            properties:
              registry:
                description: Registry is the OCI repository platform artifacts are
                  pulled from.
                pattern: ^oci://
                type: string
              version:
                description: |-
                  Version is the platform release to converge on. Changing it is the
                  upgrade; changing it back is the rollback.
                minLength: 1
                type: string
            required:
            - registry
            - version
            type: object
          status:
            description: PlatformStatus reports what is actually rolled out.
            properties:
              conditions:
                description: Conditions are Available, Progressing and Degraded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              current:
                description: Current is the release the cluster is running.
                properties:
                  digest:
                    description: |-
                      Digest is what that tag resolved to. Without it, a rollback to a tag can
                      silently land on different bytes than the ones previously running.
                    type: string
                  version:
                    description: Version is the tag named in the spec.
                    type: string
                required:
                - version
                type: object
              history:
                description: |-
                  History records recent attempts, newest first, capped at ten by the
                  reconciler that writes it.
                items:
                  description: ReleaseAttempt is one entry in the rollout history.
                  properties:
                    completionTime:
                      description: CompletionTime is when it finished, unset while
                        still running.
                      format: date-time
                      type: string
                    digest:
                      description: Digest is what that tag resolved to.
                      type: string
                    startedTime:
                      description: StartedTime is when the attempt began.
                      format: date-time
                      type: string
                    state:
                      description: State is the outcome of the attempt.
                      enum:
                      - Completed
                      - Partial
                      type: string
                    version:
                      description: Version is the tag this attempt targeted.
                      type: string
                  required:
                  - startedTime
                  - state
                  - version
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
