name: ci

# TEMPORARILY DISABLED. Manual dispatch only — nothing runs on push, on a pull
# request, or nightly. This suspends non-negotiable 10 in AGENTS.md: while these
# triggers are commented out the gates run only when someone remembers, which is
# to say they are not gates. Restore the block below to re-enable.
#
#  pull_request:
#  push:
#    branches: [main]
#  schedule:
#    # Pinned external versions rot without anyone noticing until a bring-up
#    # fails halfway through. Checked nightly rather than per-PR so a deleted
#    # upstream release does not block unrelated work.
#    - cron: "17 3 * * *"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything in this job must stay fast enough to run on every keystroke
  # locally. The moment it needs a cluster, the tier boundary has been violated
  # (roadmap.md, sequencing notes).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # From go.mod rather than a version pinned here as well: the two drift,
          # and the mismatch surfaces as a build failure in CI only, which is the
          # most expensive place to discover it.
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: make vet

      - name: e2e suite compiles
        # The e2e tests are behind a build tag and therefore invisible to the
        # unit job. Without this they rot silently until someone next brings up
        # a cluster.
        run: make vet-e2e

      - name: unit tests and coverage floor
        run: make cover

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

      - name: generated files are current
        # A generated file that disagrees with its source is a build that lies
        # about what it contains.
        run: |
          go mod tidy
          make generate
          git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint pin
        id: pins
        # Read from hack/versions.sh, the only place a version may live. `latest`
        # here turns an upstream release into a red build nobody caused, on a PR
        # that changed nothing golangci-lint had an opinion about before.
        run: |
          source hack/versions.sh
          echo "golangci=${GOLANGCI_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.pins.outputs.golangci }}

      - name: shellcheck
        # -x follows sourced files, so lib.sh and versions.sh are checked in
        # the context that actually uses them.
        run: shellcheck -x hack/*.sh

      - name: progress output stays off stdout
        run: make check-stdout

      - name: shell formatting
        run: make shfmt

      - name: workflow lint
        # This file is itself a deliverable and nothing else type-checks it.
        run: make actionlint

  # Separate from lint because it fails for a reason nobody in the PR caused: a
  # new advisory against a dependency turns an unrelated change red, and that is
  # the point — the module graph is only as current as the last person who looked.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: make vuln

  # Proves hack/deps.sh install actually works on a machine that has none of
  # the tools. Every developer runs it exactly once, on a machine nobody else
  # can reproduce, which is precisely the code that rots unwatched.
  #
  # A hosted runner has no nested virtualisation and no re-logged-in shell for
  # the new group membership, so this asserts the tools and stops there;
  # host capabilities are the e2e job's problem.
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain from scratch
        run: hack/deps.sh install

      - name: every pinned tool is present at its pinned version
        run: hack/deps.sh check --tools-only

      - name: install is idempotent
        # A second run must install nothing and still exit clean. Without this
        # the script is only ever exercised against an empty machine, and the
        # re-run path — which is what developers actually hit — is untested.
        run: |
          hack/deps.sh install
          hack/deps.sh check --tools-only

  versions:
    # Dispatch too, or the one trigger left cannot reach this job at all.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: hack/versions.sh check

  # E2E runs against real Talos guests on KVM and nothing else. kind or minikube
  # would make this job green while testing none of what phase 0 exists to
  # prove: the DRBD system extension, DRBD replication, and unclean node loss.
  # test/e2e asserts the nodes really are Talos, so a substituted cluster fails
  # rather than passes.
  #
  # GitHub-hosted runners provide no nested KVM, so this needs a self-hosted
  # runner with /dev/kvm. It is skipped rather than silently absent when
  # E2E_RUNNER is unset.
  e2e:
    if: vars.E2E_RUNNER != ''
    runs-on: ${{ vars.E2E_RUNNER }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: runner has real virtualisation
        run: |
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable — this runner cannot host Talos guests"; exit 1; }
          hack/deps.sh check

      - name: cluster up
        run: make cluster-up

      - name: e2e assertions
        run: make e2e

      - name: cluster status on failure
        if: failure()
        run: make cluster-status

      - name: cluster down
        # Always: a leaked libvirt domain holds several GB of RAM and poisons
        # the next run on a self-hosted runner.
        if: always()
        run: make cluster-down
