{{- /*
  A Service with a pinned ClusterIP, separate from the chart's own.

  The API server runs in the host network namespace and has no cluster DNS, so
  the OIDC issuer URL has to be an address it can dial directly.

  A NodePort on the control-plane node's own address rather than a ClusterIP.
  The ClusterIP was tried first and refused with EPERM from the API server, even
  with the Service's endpoints healthy: Cilium's socket load balancer translates
  ClusterIPs for pods and for host-network pods, but the API server static pod
  did not get that translation. A node IP needs no translation at all.

  The port is fixed rather than allocated, because the address appears in three
  places that must agree: this Service, the API server's --oidc-issuer-url, and
  the SAN of the certificate Keycloak serves.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak-oidc
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloakx
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: {{ .Values.oidc.port }}
      targetPort: https
      nodePort: {{ .Values.oidc.nodePort }}
      protocol: TCP
