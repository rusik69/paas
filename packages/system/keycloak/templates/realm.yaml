{{- /*
  The realm, imported at startup rather than configured by hand.

  Two details here are load-bearing and silent when wrong:

    - the group membership mapper. Keycloak puts no group claim in tokens
      without one, so every paas:tenant:* RoleBinding would match nothing and
      nothing would say so.
    - full.path false. With it true the claim carries "/paas:tenant:acme", and
      the bindings name "paas:tenant:acme" — a leading slash is enough to make
      every authorization decision come out empty.
    - the audience mapper. Keycloak puts "account" in a public client's aud
      claim, not the client id, and the API server rejects a token whose
      audience does not contain its --oidc-client-id. Without this the token is
      issued, presented, and refused with a bare 401 that says nothing about
      why.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-realm
  namespace: {{ .Release.Namespace }}
data:
  paas-realm.json: |
    {
      "realm": {{ .Values.oidc.realm | quote }},
      "enabled": true,
      "groups": [
        {"name": "paas:tenant:acme"}
      ],
      "clients": [
        {
          "clientId": {{ .Values.oidc.clientId | quote }},
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": {{ .Values.oidc.clientId | quote }},
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": {{ .Values.oidc.testUser | quote }},
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {"type": "password", "value": {{ .Values.oidc.testPassword | quote }}}
          ],
          "groups": ["/paas:tenant:acme"]
        }
      ]
    }
