# The database CloudNativePG provisions for Keycloak.
database:
  # One instance: this is the platform's own identity provider on a three-node
  # dev cluster, and DRBD already replicates the volume underneath it. High
  # availability for the control plane's own database is its own phase.
  instances: 1
  size: 2Gi
  storageClass: replicated-3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# The OIDC identity the API server is configured to trust. Every value here
# appears somewhere else too and must agree: host and port with the certificate
# SAN and the API server's issuer URL, realm and clientId with its --oidc-* flags.
oidc:
  # The control-plane node's own address, where Keycloak binds directly. Both a
  # pinned ClusterIP and a NodePort were tried and refused with EPERM: Cilium's
  # socket load balancer translates service addresses for pods and host-network
  # pods alike — measured, on this very node — but the kube-apiserver static pod
  # does not get that translation. A host-network listener needs none.
  host: 10.77.0.11
  port: 8443
  realm: paas
  clientId: kubernetes
  # A fixture identity, for the e2e that proves a token maps to a tenant role.
  # Not a credential worth protecting: it exists only on a cluster the test
  # created and destroys.
  testUser: alice
  testPassword: alice-password

# Values reaching the vendored chart. Everything the platform decides lives
# here, so the vendored directory stays a verbatim copy of upstream.
keycloakx:
  # The issuer is an address on the node, not a Service, so Keycloak binds the
  # node's network namespace. Requires the patch to the vendored chart, which
  # has no upstream option for it.
  hostNetwork: true

  # And the node has to be the one the issuer URL names. The control plane is
  # deliberate: it is the node the storage suite never powers off, so killing a
  # worker cannot take the cluster's authentication source with it — the same
  # reason the LINSTOR controller is pinned here. Scheduling on the control
  # plane is otherwise off, hence the toleration.
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  command:
    # start-dev keeps the relaxed hostname checks a production start enforces,
    # while the TLS below is what makes the issuer usable: Kubernetes requires an
    # HTTPS issuer, so serving plain HTTP was never going to be enough.
    - "/opt/keycloak/bin/kc.sh"
    - "start-dev"
    - "--http-enabled=true"
    - "--import-realm"

  extraEnv: |
    - name: KC_HTTPS_CERTIFICATE_FILE
      value: /opt/keycloak/tls/tls.crt
    - name: KC_HTTPS_CERTIFICATE_KEY_FILE
      value: /opt/keycloak/tls/tls.key
    # Must match --oidc-issuer-url exactly. Keycloak stamps this into every
    # token's iss claim, and the API server rejects a token whose issuer differs
    # by so much as a port.
    - name: KC_HOSTNAME
      value: "https://10.77.0.11:8443"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    # Certificates turn on TLS for the management interface too, and the chart's
    # health probes speak plain HTTP to it — so Keycloak starts, imports its
    # realm, serves both ports, and never becomes Ready. TLS belongs on the
    # client-facing port; the probes are localhost traffic inside the pod.
    - name: KC_HTTP_MANAGEMENT_SCHEME
      value: http

  extraVolumes: |
    - name: tls
      secret:
        secretName: keycloak-tls
    - name: realm
      configMap:
        name: keycloak-realm

  extraVolumeMounts: |
    - name: tls
      mountPath: /opt/keycloak/tls
      readOnly: true
    - name: realm
      mountPath: /opt/keycloak/data/import
      readOnly: true

  http:
    # Keycloak has served at the root since v17; the chart still defaults to the
    # legacy /auth prefix. The issuer URL ends up in every token and in the API
    # server's OIDC configuration, so it is worth being the modern one rather
    # than carrying a path that exists for compatibility with Keycloak 16.
    relativePath: "/"

  # Waits for Postgres to accept connections, which is why the database can live
  # in the same chart without an ordering stage.
  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: keycloak-db-rw
    port: 5432
    database: keycloak
    # The Secret CloudNativePG generates for the owner declared above.
    existingSecret: keycloak-db-app
    existingSecretKey: password
    username: keycloak

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # A limit, not just a request, because the JVM sizes its heap against
      # whatever memory it can see. Unbounded on a node it shares with etcd and
      # the API server, it grew until the kernel picked a victim — and the
      # kernel's choice is not always Keycloak.
      memory: 1536Mi
