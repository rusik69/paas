# The platform release manifest: what one platform version installs.
#
# Read by the Platform reconciler out of the release artifact, never from this
# file directly — hack/publish.sh pushes it, and the cluster only ever sees the
# pushed copy.
#
# stage orders the rollout. Every migration reaches Ready before any component
# starts, enforced by Flux dependsOn rather than by sequencing at runtime.
packages:
  # A real component, delivered by the platform rather than by hand. Its
  # database is what Keycloak will need in phase 2's remaining bullet.
  - name: cnpg
    chart: cnpg
    version: "0.1.0"
    # migration, not component: it provides the Cluster CRD and the admission
    # webhook that keycloak's own manifests need, so it has to be Ready before
    # anything that declares one is installed. That is what the stage is for —
    # things that must land before the components that depend on them.
    stage: migration

  # The platform's identity provider, and the database it needs — which is why
  # CloudNativePG above is a component rather than a phase-3 concern.
  - name: keycloak
    chart: keycloak
    version: "0.1.0"
    stage: component

  - name: hello-migrate
    chart: hello-migrate
    version: "0.1.0"
    stage: migration
  - name: hello
    chart: hello
    version: "0.1.0"
    stage: component
    values:
      message: v1

  # ServiceClass objects only, nothing else. A component, not a migration: it
  # needs the Cluster CRD cnpg's migration stage installs, and being a
  # component gets it the automatic dependsOn on every migration for free —
  # see internal/controller/pkg.Reconciler.dependencies.
  - name: catalog
    chart: catalog
    version: "0.1.0"
    stage: component
